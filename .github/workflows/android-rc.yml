name: Android RC Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - polish/app-2026-09-16
    paths:
      - ".github/workflows/android-rc.yml"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - "*.html"
      - "*.css"
      - "*.js"
      - "assets/**"
      - "icons/**"
      - "vendor/**"

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npm run cap:add:android

      - name: Confirm Android API target
        run: |
          grep -R "targetSdk" android/variables.gradle android/app/build.gradle* || true
          grep -R "compileSdk" android/variables.gradle android/app/build.gradle* || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: memories-unlocked-android-rc-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
