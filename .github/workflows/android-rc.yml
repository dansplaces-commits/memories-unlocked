name: Android RC Debug Build

# RC trigger 2026-09-18

on:
  workflow_dispatch:
  push:
    branches:
      - polish/app-2026-09-16
      - release/v2-launch-candidate-2026-10-09
    paths:
      - ".github/workflows/android-rc.yml"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - "tests/**"
      - "*.html"
      - "*.css"
      - "*.js"
      - "assets/**"
      - "icons/**"
      - "vendor/**"

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Use Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Check launch-critical JavaScript syntax
        run: |
          node --check app.js
          node --check account.js
          node --check media.js
          node --check interactive-tools.js
          node --check photo-studio.js
          node --check supabase-config.js
          node --check sw.js

      - name: Run JavaScript regression tests
        run: node --test tests/polish-unit.cjs tests/photo-studio-unit.cjs

      - name: Generate Android project
        run: npm run cap:add:android

      - name: Confirm Android API target
        run: |
          grep -R "targetSdk" android/variables.gradle android/app/build.gradle* || true
          grep -R "compileSdk" android/variables.gradle android/app/build.gradle* || true

      - name: Create stable Android test signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA256:|Valid from:"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Re-sign APK for broad device compatibility
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/app-debug-original.apk
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out android/app/build/outputs/apk/debug/memories-unlocked-install.apk \
            android/app/build/outputs/apk/debug/app-debug-original.apk

      - name: Verify final install APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/debug/memories-unlocked-install.apk

      - name: Upload Android RC test bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memories-unlocked-android-rc-debug
          path: |
            android/app/build/outputs/apk/debug/memories-unlocked-install.apk
            icons/icon-1024.png
          if-no-files-found: error
          retention-days: 14
