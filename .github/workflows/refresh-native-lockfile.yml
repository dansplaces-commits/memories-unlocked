name: Refresh Native Lockfile

on:
  push:
    branches:
      - release/v2-launch-candidate-2026-10-09
    paths:
      - "package.json"

jobs:
  generate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout launch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Resolve exact lockfile without running dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memories-unlocked-refreshed-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: generate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout launch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download refreshed lockfile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: memories-unlocked-refreshed-lockfile
          path: /tmp/mu-lock
      - name: Commit refreshed lockfile
        run: |
          set -euo pipefail
          cp /tmp/mu-lock/package-lock.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches package.json."
            exit 0
          fi
          git commit -m "Refresh native dependency lock [skip ci]"
          git push
